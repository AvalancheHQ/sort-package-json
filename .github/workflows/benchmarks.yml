name: Benchmarks
permissions:
  contents: read
  id-token: write
'on':
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
defaults:
  run:
    shell: bash
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
    - uses: taiki-e/checkout-action@b13d20b7cda4e2f325ef19895128f7ff735c0b3d
    - uses: oxc-project/setup-rust@ecabb7322a2ba5aeedb3612d2a40b86a85cee235
      with:
        save-cache: ${{ github.ref_name == 'main' }}
    - name: Install cargo-codspeed
      uses: taiki-e/install-action@f900b8c52f954ba47cda7939fb43ee15e1c13e20
      with:
        tool: cargo-codspeed@4.4.1
    - name: Run benchmarks
      uses: CodSpeedHQ/action@4d3a828b8109e5e0a8ca5f5dc2dbb05751ab1ae5
      with:
        upload-url: ${{ secrets.CODSPEED_FRANCOIS_DEV_UPLOAD_URL }}
        run: cargo codspeed build && cargo codspeed run
        mode: simulation
