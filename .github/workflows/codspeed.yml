name: CodSpeed Performance Benchmarks
permissions:
  contents: read
  id-token: write
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
defaults:
  run:
    shell: bash
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
    - uses: taiki-e/checkout-action@b13d20b7cda4e2f325ef19895128f7ff735c0b3d
    - uses: moonrepo/setup-rust@e013866c4215f77c925f42f60257dec7dd18836e
      with:
        cache: false
        bins: cargo-codspeed
    - name: Build benchmarks
      run: cargo codspeed build
    - name: Run benchmarks
      uses: CodSpeedHQ/action@80a87e5df8dac957e61e7bdb46adf07bc1cf426e
      with:
        upload-url: ${{ secrets.CODSPEED_FRANCOIS_DEV_UPLOAD_URL }}
        mode: simulation
        run: cargo codspeed run
